name: CI

# Hardware-free checks on both supported platforms: install exactly as the
# README says, run the tests, build the packaged app, then launch it and poke
# its HTTP endpoints. (Real-device tunnels can't run on hosted runners.)
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create venv + install requirements (README steps)
        run: |
          python -m venv .venv
          if [ "$RUNNER_OS" = "Windows" ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install -r requirements.txt pyinstaller
          echo "PY=$PWD/$PY" >> "$GITHUB_ENV"

      - name: Import the device/tunnel stack
        run: |
          "$PY" -c "import pymobiledevice3.remote.tunnel_service, pytun_pmd3, device_manager; print('TUN backend:', pytun_pmd3.TunTapDevice.__module__)"

      - name: Tests
        run: |
          "$PY" test_multidevice.py
          "$PY" test_smoke.py
          "$PY" test_quit.py

      - name: Build betterGeoPort.app (macOS)
        if: runner.os == 'macOS'
        run: |
          source .venv/bin/activate
          ./packaging/build_app.sh "$PWD/betterGeoPort.app"

      - name: Build betterGeoPort.exe (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./packaging/build_windows.ps1

      - name: Install to the Start menu, then uninstall (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dir = "$env:LOCALAPPDATA\Programs\betterGeoPort"
          $lnk = Join-Path ([Environment]::GetFolderPath('Programs')) 'betterGeoPort.lnk'
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\betterGeoPort'
          ./dist/betterGeoPort/install_windows.ps1         # as from the extracted zip
          if (-not ((Test-Path "$dir\betterGeoPort.exe") -and (Test-Path $lnk) -and (Test-Path $key))) { throw 'not installed' }
          $u = (Get-ItemProperty $key).UninstallString     # what Settings > Apps > Uninstall runs
          Start-Process cmd.exe -ArgumentList "/c $u" -Wait -NoNewWindow
          if ((Test-Path $dir) -or (Test-Path $lnk) -or (Test-Path $key)) { throw 'not uninstalled' }

      - name: Launch the packaged app and hit its endpoints
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            APP_BIN=dist/betterGeoPort/betterGeoPort.exe
            # The .exe requests elevation in its manifest; run it as the invoker here.
            export __COMPAT_LAYER=RunAsInvoker
          else
            APP_BIN=betterGeoPort.app/Contents/Resources/GeoPort/GeoPort
          fi
          PORT=54330
          "$APP_BIN" --no-browser --no-elevate --port $PORT > app.log 2>&1 &
          trap 'echo "--- app.log"; cat app.log' EXIT
          for i in $(seq 1 120); do curl -sf -o /dev/null "http://127.0.0.1:$PORT/" && break; sleep 1; done
          curl -sf "http://127.0.0.1:$PORT/" -o page.html
          grep -q 'id="setupWarn"' page.html
          curl -sf "http://127.0.0.1:$PORT/static/vendor/leaflet/leaflet.js" -o /dev/null
          curl -sf "http://127.0.0.1:$PORT/app_meta" | "$PY" -c "import sys, json; print('setup_message:', json.load(sys.stdin)['setup_message'])"
          echo "list_devices: $(curl -sf "http://127.0.0.1:$PORT/list_devices")"
          curl -sf -X POST "http://127.0.0.1:$PORT/exit"
          stopped() { for i in $(seq 1 15); do curl -s -o /dev/null -m 1 "http://127.0.0.1:$PORT/" || return 0; sleep 1; done; return 1; }
          stopped || { echo "app did not shut down"; exit 1; }

          if [ "$RUNNER_OS" = "macOS" ]; then
            # The .app's launcher passes --watch-pid; quitting the app ends that
            # process, and the server must follow (resetting devices on the way).
            sleep 600 & LAUNCHER=$!
            "$APP_BIN" --no-browser --port $PORT --watch-pid $LAUNCHER > app.log 2>&1 &
            for i in $(seq 1 120); do curl -sf -o /dev/null "http://127.0.0.1:$PORT/" && break; sleep 1; done
            curl -sf -o /dev/null "http://127.0.0.1:$PORT/"
            kill $LAUNCHER
            stopped || { echo "app kept running after its launcher quit"; exit 1; }
            grep -q "The app was quit" app.log
          fi
